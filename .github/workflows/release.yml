name: Native dual-architecture release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable packaging version (never reuse)
        required: true
        default: 6.33.0-xcloud.3
permissions:
  contents: read
  packages: write
concurrency:
  group: statamic-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject existing release tag
        env:
          VERSION: ${{ inputs.version }}
        run: python3 tests/registry.py --absent "$VERSION"
  build-test:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build natively and push by digest only
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/neobuilds/statamic,push-by-digest=true,name-canonical=true,push=true
          build-args: PACKAGING_VERSION=${{ inputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Anonymous native runtime qualification
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker logout ghcr.io
          mkdir -p evidence
          python3 -m pip install requests
          python3 tests/runtime.py "ghcr.io/neobuilds/statamic@$DIGEST" "$ARCH" "evidence/runtime-$ARCH.json"
          printf '%s' "$DIGEST" > "evidence/digest-$ARCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.arch }}
          path: evidence/
  publish:
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: evidence
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish only after both native runtime suites pass
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 tests/registry.py --absent "$VERSION"
          docker buildx imagetools create -t "ghcr.io/neobuilds/statamic:$VERSION" "ghcr.io/neobuilds/statamic@$(cat evidence/digest-amd64)" "ghcr.io/neobuilds/statamic@$(cat evidence/digest-arm64)"
          docker logout ghcr.io
          python3 tests/registry.py "$VERSION" > evidence/anonymous-registry.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: evidence/
