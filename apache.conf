<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ServerName localhost
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /data/public/assets>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /data/storage/app/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
ServerTokens Prod
ServerSignature Off
